<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now | Fedokhotel</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/" class="site-logo">Fedokhotel</a>
      <nav class="site-nav">
        <a href="/">Rooms</a>
        <a href="/book.html">Book Now</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <section class="room-hero">
        <span class="room-eyebrow">— Reservations —</span>
        <h1 class="room-title">Book Your Stay</h1>
        <p class="room-lede">Select your room and dates. We’ll confirm availability shortly.</p>
      </section>

      <form class="booking-form" id="booking-form">
        <div class="form-group">
          <label for="room">Room Type</label>
          <select id="room" name="room" required>
            <option value="">Select a room</option>
            <option value="standard">Standard Room — ₦35,000 / night</option>
            <option value="deluxe">Deluxe Room — ₦55,000 / night</option>
            <option value="executive">Executive Suite — ₦85,000 / night</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="check_in">Check-in</label>
            <input type="date" id="check_in" name="check_in" required>
          </div>
          <div class="form-group">
            <label for="check_out">Check-out</label>
            <input type="date" id="check_out" name="check_out" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="guests">Guests</label>
            <input type="number" id="guests" name="guests" min="1" max="4" value="2" required>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="0803..." required>
          </div>
        </div>

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="notes">Special requests (optional)</label>
          <textarea id="notes" name="notes" rows="3"></textarea>
        </div>

        <div class="cta" style="margin-top: 1.5rem;">
          <button type="submit" class="btn" id="submit-btn">Request Booking</button>
        </div>

        <p id="form-message" style="text-align:center; margin-top:1rem; font-size:0.9rem; color:var(--ink-soft);"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© Fedokhotel · Port Harcourt</div>
  </footer>

  <script src="/js/booking.js"></script>
</body>
</html>
