<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Desk · Fedok 144</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: Inter, sans-serif; background: #F8F5F0; color: #1A1A1A; }
    header { background: #262019; color: #F8F5F0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 1.25rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
    .card { background: #fff; border-radius: 10px; padding: 1.25rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .card h2 { margin: 0 0 1rem; font-size: 1rem; letter-spacing: 0.06em; text-transform: uppercase; color: #C9A962; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.75rem 0 0.3rem; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.75rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 0.95rem; }
    button { margin-top: 1rem; background: #C9A962; border: none; padding: 0.75rem 1.25rem; font-weight: 600; cursor: pointer; border-radius: 2px; }
    button.secondary { background: transparent; border: 1px solid #C9A962; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.6rem 0.4rem; border-bottom: 1px solid #eee; }
    .note { font-size: 0.85rem; color: #5C5347; margin-top: 0.75rem; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Fedok 144 · Front Desk</h1>
    <span style="opacity:0.7;font-size:0.85rem;">Receptionist console (wire to D1)</span>
  </header>
  <main>
    <div class="grid">
      <div class="card">
        <h2>Walk-in / Phone booking</h2>
        <form id="walkin">
          <label>Guest name</label>
          <input name="guest_name" required>
          <label>Phone</label>
          <input name="guest_phone" type="tel" required>
          <label>Room type</label>
          <select name="room_type_slug" required>
            <option value="standard">Standard — ₦35,000</option>
            <option value="deluxe">Deluxe — ₦55,000</option>
            <option value="executive">Executive — ₦85,000</option>
          </select>
          <label>Check-in</label>
          <input name="check_in" type="date" required>
          <label>Check-out</label>
          <input name="check_out" type="date" required>
          <label>Guests</label>
          <input name="guests" type="number" min="1" max="4" value="1">
          <label>Notes</label>
          <textarea name="notes" rows="2"></textarea>
          <button type="submit">Create booking</button>
        </form>
        <p class="note">Creates a booking with source=walkin or phone. Same table as online bookings.</p>
      </div>
      <div class="card">
        <h2>Today’s arrivals / search</h2>
        <label>Search reference or phone</label>
        <input id="search" placeholder="FED-… or phone">
        <button type="button" class="secondary" id="search-btn">Search</button>
        <div style="margin-top:1rem;overflow:auto">
          <table>
            <thead><tr><th>Ref</th><th>Guest</th><th>In</th><th>Out</th><th>Status</th></tr></thead>
            <tbody id="rows">
              <tr><td colspan="5" style="color:#888">Connect Worker API to list bookings</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('walkin').addEventListener('submit', e => {
      e.preventDefault();
      alert('Wire this form to POST /api/bookings once the Worker is deployed.');
    });
  </script>
</body>
</html>
